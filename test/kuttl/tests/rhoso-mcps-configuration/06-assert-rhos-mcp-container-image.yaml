# Assert dev.rhosMCP.containerImage override is applied to the rhoso-mcps sidecar.
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
collectors:
  - type: command
    command: ../../common/collectors/collect-workload-diagnostics.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-stack-deployment
  namespace: openstack-lightspeed
spec:
  template:
    spec:
      containers:
        - name: ogx
        - name: lightspeed-service-api
        - name: lightspeed-to-dataverse-exporter
        - name: rhoso-mcps
          image: quay.io/openstack-lightspeed/lightspeed-mcps:latest
status:
  replicas: 1
  readyReplicas: 1
  availableReplicas: 1
